<!DOCTYPE html>
<html>
<head>
    <title>Lausse Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #111; color: white; padding: 20px; font-family: monospace; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { border: 1px solid #333; padding: 10px; background: #222; }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .flagged { border: 2px solid red; }
        button { background: red; color: white; border: none; padding: 5px; width: 100%; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>Mod Dashboard</h1>
    <div class="grid" id="grid"></div>
    <script>
        const SECRET = 'lausse-admin-key'; // Matches server.js

        async function load() {
            const res = await fetch(`/api/admin/all?secret=${SECRET}`);
            const data = await res.json();
            const grid = document.getElementById('grid');
            
            data.forEach(loc => {
                loc.contributions.forEach(c => {
                    const isFlagged = c.reports > 0 ? 'flagged' : '';
                    if(c.type === 'image') {
                        grid.innerHTML += `
                            <div class="card ${isFlagged}">
                                <img src="${c.url}">
                                <p>${c.text}</p>
                                <small>Reports: ${c.reports || 0}</small>
                                <button onclick="nuke('${c.id}', 'contrib')">DELETE</button>
                            </div>
                        `;
                    }
                });
            });
        }

        async function nuke(id, type) {
            if(!confirm("Permanently delete?")) return;
            await fetch('/api/admin/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ secret: SECRET, id, type })
            });
            location.reload();
        }
        load();
    </script>
</body>
</html>
