<!DOCTYPE html>
<html>
<head>
    <title>Lausse Sheriff</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #111; color: white; padding: 20px; font-family: monospace; }
        .login-box { max-width: 300px; margin: 50px auto; text-align: center; }
        input { padding: 10px; width: 100%; background: #222; border: 1px solid #E74C3C; color: white; margin-bottom: 10px; }
        button { background: #E74C3C; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { border: 1px solid #333; padding: 10px; background: #222; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .flagged { border: 2px solid red; }
        .status-removed { opacity: 0.5; filter: grayscale(1); }
        
        .btn-del { background: red; margin-top: 5px; }
        .btn-restore { background: #2ecc71; color: black; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="login" class="login-box">
        <h2>IDENTIFY YOURSELF</h2>
        <input type="password" id="secretKey" placeholder="Enter Admin Key...">
        <button onclick="loadDashboard()">ACCESS ARCHIVE</button>
    </div>

    <div id="dashboard" style="display:none;">
        <h1>MODERATION DASHBOARD</h1>
        <div class="grid" id="grid"></div>
    </div>

    <script>
        let USER_KEY = '';

        async function loadDashboard() {
            USER_KEY = document.getElementById('secretKey').value;
            try {
                const res = await fetch(`/api/admin/all?secret=${USER_KEY}`);
                if(res.status === 403) return alert("ACCESS DENIED");
                const data = await res.json();
                document.getElementById('login').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                renderGrid(data);
            } catch(e) { alert("Connection Error"); }
        }

        function renderGrid(data) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            data.forEach(loc => {
                loc.contributions.forEach(c => {
                    // Detect status
                    const isFlagged = (c.reports > 0 || c.status === 'flagged') ? 'flagged' : '';
                    const isRemoved = c.status === 'removed' ? 'status-removed' : '';
                    
                    if(c.type === 'image') {
                        grid.innerHTML += `
                            <div class="card ${isFlagged} ${isRemoved}">
                                <img src="${c.url}">
                                <p>${c.text}</p>
                                <div>Status: ${c.status || 'active'}</div>
                                <div>Reports: ${c.reports||0}</div>
                                <button class="btn-restore" onclick="restore('${c.id}')">RESTORE / UNFLAG</button>
                                <button class="btn-del" onclick="nuke('${c.id}', 'contrib')">PERMANENT DELETE</button>
                            </div>
                        `;
                    }
                });
            });
        }

        async function nuke(id, type) {
            if(!confirm("Permanently delete? Cannot be undone.")) return;
            await api('/api/admin/delete', { id, type });
        }

        async function restore(id) {
            await api('/api/admin/restore', { id });
        }

        async function api(url, body) {
            await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ secret: USER_KEY, ...body })
            });
            loadDashboard(); // Refresh
        }
    </script>
</body>
</html>
