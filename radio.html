<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lausse FM - Live Radio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="radio-page-body antialiased">
    <div class="grain-overlay"></div>

    <button class="menu-button" id="menu-button" aria-label="Open menu">
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
    </button>

    <nav class="menu-overlay" id="menu-overlay">
        <ul class="space-y-1">
            <li><a href="index.html">Timeline</a></li>
            <li><a href="radio.html" class="!text-[#E74C3C]">RADIO ● LIVE</a></li>
            <li><a href="the-mocking-stars.html">Mocking Stars</a></li>
            <li><a href="about.html">About & FAQ</a></li>
            <li><a href="https://www.reddit.com/r/Laussethecat/" target="_blank" rel="noopener">Reddit</a></li>
        </ul>
    </nav>

    <main class="radio-container">
        
        <div class="radio-interface">
            <div class="radio-header">
                <div class="status-row">
                    <div class="on-air-badge">● LIVE</div>
                    <div id="listener-count" class="listener-badge">Connecting...</div>
                </div>
                <h1 class="bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">LAUSSE FM</h1>
                <p class="text-[#666] text-sm mt-1">24/7 Lo-Fi & Underground</p>
            </div>

            <div class="radio-visual">
                <img src="https://assets.laussehub.co.uk/assets/lausse-welcome.png" alt="Now Playing" id="radio-art" class="shadow-2xl">
            </div>

            <div class="now-playing-info">
                <h2 id="radio-song-title">Connecting...</h2>
                <h3 id="radio-artist-name">Lausse Hub Radio</h3>
            </div>

            <div class="progress-wrapper">
                <div class="time-text" id="time-elapsed">0:00</div>
                <div class="progress-bar-bg">
                    <div id="progress-fill" class="progress-bar-fill"></div>
                </div>
                <div class="time-text" id="time-total">0:00</div>
            </div>

            <div class="radio-controls">
                <button id="radio-play-btn" class="big-play-btn" aria-label="Play radio">▶</button>
                <div class="flex items-center justify-center gap-2.5 w-full">
                    <span class="text-xs opacity-60">🔈</span>
                    <input type="range" id="radio-volume" min="0" max="1" step="0.1" value="1" class="w-32">
                    <span class="text-xs opacity-60">🔊</span>
                </div>
            </div>
        </div>

        <div class="radio-chat-container">
            <iframe 
                src="https://chat.53clav.duckdns.org" 
                class="border-0 w-full h-[450px]"
                title="Lausse Hub Chat"
                loading="lazy">
            </iframe>
        </div>

        <audio id="radio-stream" preload="none">
            <source src="https://radio.laussehub.co.uk/listen/lausse/radio.mp3" type="audio/mpeg">
        </audio>

    </main>

    <script type="module" src="/src/js/pages/radio.js"></script>
</body>
</html>
