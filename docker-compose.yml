version: '3'
services:
  website:
    build: .
    restart: always
    networks:
      - default

  backend:
    build: ./backend
    restart: always
    volumes:
      - ./graffiti_data:/app/data
      - ./graffiti_uploads:/app/uploads
    # This line is key: it tells Docker to look for the file on the SERVER
    environment:
      - ADMIN_SECRET=${ADMIN_SECRET}
    networks:
      - default

networks:
  default:
    external: true
    name: clav