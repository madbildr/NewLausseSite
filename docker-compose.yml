version: '3'
services:
  website:
    build: .              # <--- Changed from 'image: nginx'
    restart: always
    networks:
      - default
  backend:
    build: ./backend
    restart: always
    volumes:
      - ./graffiti_data:/app/data        # Saves the JSON database to your host folder
      - ./graffiti_uploads:/app/uploads  # Saves user photos to your host folder
    networks:
      - default

networks:
  default:
    external: true
    name: clav

