<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lausse Archives</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Dark Gritty Theme */
        body { margin: 0; background: #0a0a0a; color: #eee; font-family: 'Courier New', sans-serif; overflow: hidden; }
        .nav-header { position: absolute; top: 15px; left: 15px; z-index: 1000; }
        .nav-header a { background: #000; color: #E74C3C; padding: 8px 15px; text-decoration: none; border: 1px solid #E74C3C; font-weight: bold; }
        
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        /* Location Picker */
        #picker-ui { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1500; pointer-events: none; }
        .center-pin { font-size: 40px; color: #E74C3C; text-shadow: 0 4px 10px black; }
        #confirm-loc-btn { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 1500; background: #2ecc71; color: black; border: none; padding: 15px 30px; font-weight: bold; font-family: inherit; cursor: pointer; display: none; box-shadow: 0 4px 15px black; }

        /* Side Panel / Feed */
        .feed-panel {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 450px; height: 100%;
            background: #111; z-index: 2000; transition: right 0.3s ease;
            display: flex; flex-direction: column; border-left: 2px solid #333;
        }
        .feed-panel.active { right: 0; }
        .feed-header { padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: #161616; }
        .feed-content { flex-grow: 1; overflow-y: auto; padding: 15px; }

        .card { background: #1a1a1a; margin-bottom: 20px; border: 1px solid #333; border-radius: 4px; overflow: hidden; }
        .card-img { width: 100%; display: block; max-height: 400px; object-fit: cover; }
        .card-body { padding: 15px; }
        .vote-actions { display: flex; align-items: center; margin-top: 10px; }
        .vote-actions button { background: none; border: none; color: #555; cursor: pointer; font-size: 1.2rem; padding: 0 8px; }
        .vote-actions button:hover { color: #fff; }
        .vote-score { font-weight: bold; color: #888; margin: 0 5px; }

        .fab-add { position: absolute; bottom: 30px; right: 20px; width: 60px; height: 60px; background: #E74C3C; border-radius: 50%; border: none; color: white; font-size: 30px; z-index: 1000; cursor: pointer; box-shadow: 0 4px 10px black; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; align-items: center; justify-content: center; }
        .modal-box { background: #111; padding: 30px; border: 1px solid #E74C3C; width: 90%; max-width: 400px; }
        input[type="text"] { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; margin-bottom: 10px; }
        .btn-main { width: 100%; padding: 15px; background: #E74C3C; color: white; border: none; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-sec { width: 100%; padding: 10px; background: #333; color: #ccc; border: 1px solid #444; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="nav-header"><a href="index.html">HUB</a></div>

    <div id="map"></div>
    
    <div id="picker-ui"><i class="fas fa-map-marker-alt center-pin"></i></div>
    <button id="confirm-loc-btn" onclick="confirmManualLocation()">📍 CONFIRM LOCATION</button>

    <button class="fab-add" id="fab" onclick="document.getElementById('newPinModal').style.display='flex'">+</button>

    <div class="feed-panel" id="feedPanel">
        <div class="feed-header">
            <span style="color:#E74C3C; font-weight:bold;">ARCHIVE RECORD</span>
            <button onclick="document.getElementById('feedPanel').classList.remove('active')" style="background:none; border:none; color:white; font-size:1.5rem;">&times;</button>
        </div>
        <div class="feed-content" id="feedContent"></div>
        <div style="padding:15px; background:#222; border-top:1px solid #333;">
            <input type="text" id="updateText" placeholder="Add comment...">
            <input type="file" id="updatePhoto" style="display:none;">
            <button onclick="document.getElementById('updatePhoto').click()" class="btn-sec">📸 Attach Photo</button>
            <button onclick="submitUpdate()" class="btn-main">POST</button>
        </div>
    </div>

    <div class="modal" id="newPinModal">
        <div class="modal-box">
            <h2 style="color:#E74C3C; margin-top:0;">NEW DISCOVERY</h2>
            
            <div id="location-options">
                <button class="btn-sec" onclick="startManualPicker()">🗺️ Pick on Map</button>
                <button class="btn-sec" onclick="useGPS()">📡 Use My GPS</button>
            </div>

            <div id="upload-form" style="display:none;">
                <p id="loc-status" style="color:#2ecc71; font-size:0.8rem;">Location Locked</p>
                <input type="file" id="newPhoto" accept="image/*">
                <input type="text" id="newDesc" placeholder="Description...">
                <button onclick="submitNewPin()" class="btn-main">UPLOAD</button>
            </div>
            
            <button onclick="closeModal()" style="background:none; border:none; color:#666; width:100%; cursor:pointer;">CANCEL</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([51.4545, -2.5879], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);

        let activeLocationId = null;
        let pendingLat = 0, pendingLng = 0;

        async function loadMap() {
            try {
                const res = await fetch('/api/graffiti');
                const data = await res.json();
                data.forEach(loc => {
                    const icon = L.divIcon({
                        html: `<div style="background:#E74C3C; width:12px; height:12px; border-radius:50%; border:2px solid black;"></div>`,
                        className: 'custom-pin'
                    });
                    L.marker([loc.lat, loc.lng], { icon }).addTo(map).on('click', () => openFeed(loc));
                });
            } catch(e) {}
        }
        loadMap();

        function openFeed(loc) {
            activeLocationId = loc.id;
            const content = document.getElementById('feedContent');
            document.getElementById('feedPanel').classList.add('active');
            content.innerHTML = '';

            loc.contributions.forEach(c => {
                const date = new Date(c.timestamp).toLocaleDateString();
                const img = c.type === 'image' ? `<img src="${c.url}" class="card-img">` : '';
                content.innerHTML += `
                    <div class="card">
                        ${img}
                        <div class="card-body">
                            <div>${c.text}</div>
                            <div style="font-size:0.8em; color:#666; margin-top:5px;">${date}</div>
                            <div class="vote-actions">
                                <button onclick="vote('${c.id}', 'up')">▲</button>
                                <span class="vote-score" id="score-${c.id}">${c.up - c.down}</span>
                                <button onclick="vote('${c.id}', 'down')">▼</button>
                                <button onclick="report('${c.id}')" style="margin-left:auto; color:#e74c3c; font-size:0.9rem;">🚩</button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        async function vote(id, type) {
            const res = await fetch(`/api/contribute/${id}/vote`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ type })
            });
            const data = await res.json();
            
            if(data.msg === "Already voted") {
                alert("You already voted on this!");
            } else if(data.success) {
                // Update UI with real server numbers
                document.getElementById(`score-${id}`).innerText = data.up - data.down;
            }
        }

        async function report(id) {
            if(confirm("Report this?")) {
                await fetch(`/api/report/${id}`, { method: 'POST' });
                alert("Reported.");
                location.reload();
            }
        }

        // --- NEW MANUAL PICKER LOGIC ---
        function startManualPicker() {
            document.getElementById('newPinModal').style.display = 'none';
            document.getElementById('fab').style.display = 'none';
            document.getElementById('picker-ui').style.display = 'block';
            document.getElementById('confirm-loc-btn').style.display = 'block';
        }

        function confirmManualLocation() {
            const center = map.getCenter();
            pendingLat = center.lat;
            pendingLng = center.lng;
            
            // Reset UI
            document.getElementById('picker-ui').style.display = 'none';
            document.getElementById('confirm-loc-btn').style.display = 'none';
            document.getElementById('fab').style.display = 'block';
            
            // Show Form
            document.getElementById('newPinModal').style.display = 'flex';
            document.getElementById('location-options').style.display = 'none';
            document.getElementById('upload-form').style.display = 'block';
            document.getElementById('loc-status').innerText = `✅ Pin: ${pendingLat.toFixed(4)}, ${pendingLng.toFixed(4)}`;
        }

        function useGPS() {
            navigator.geolocation.getCurrentPosition(pos => {
                pendingLat = pos.coords.latitude;
                pendingLng = pos.coords.longitude;
                document.getElementById('location-options').style.display = 'none';
                document.getElementById('upload-form').style.display = 'block';
                document.getElementById('loc-status').innerText = `✅ GPS: ${pendingLat.toFixed(4)}, ${pendingLng.toFixed(4)}`;
            });
        }

        function closeModal() {
            document.getElementById('newPinModal').style.display = 'none';
            // Reset state
            document.getElementById('location-options').style.display = 'block';
            document.getElementById('upload-form').style.display = 'none';
        }

        async function submitNewPin() {
            const fd = new FormData();
            fd.append('photo', document.getElementById('newPhoto').files[0]);
            fd.append('description', document.getElementById('newDesc').value);
            fd.append('lat', pendingLat);
            fd.append('lng', pendingLng);

            const res = await fetch('/api/graffiti', { method: 'POST', body: fd });
            if(res.ok) location.reload();
            else alert("Error uploading");
        }

        async function submitUpdate() {
            if(!activeLocationId) return;
            const fd = new FormData();
            fd.append('text', document.getElementById('updateText').value);
            fd.append('photo', document.getElementById('updatePhoto').files[0]);
            await fetch(`/api/graffiti/${activeLocationId}/contribute`, { method: 'POST', body: fd });
            location.reload();
        }
    </script>
</body>
</html>
