<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lausse Archives</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Dark Gritty Theme */
        body { margin: 0; background: #0a0a0a; color: #eee; font-family: 'Courier New', sans-serif; overflow: hidden; }
        .nav-header { position: absolute; top: 15px; left: 15px; z-index: 1000; }
        .nav-header a { background: #000; color: #E74C3C; padding: 8px 15px; text-decoration: none; border: 1px solid #E74C3C; font-weight: bold; }
        
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        /* Side Panel / Feed */
        .feed-panel {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 450px; height: 100%;
            background: #111; z-index: 2000; transition: right 0.3s ease;
            display: flex; flex-direction: column; border-left: 2px solid #333;
        }
        .feed-panel.active { right: 0; }
        
        .feed-header { padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: #161616; }
        .feed-title { font-size: 1.2rem; color: #E74C3C; font-weight: bold; }
        .close-feed { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

        .feed-content { flex-grow: 1; overflow-y: auto; padding: 15px; }

        /* Contribution Card */
        .card { background: #1a1a1a; margin-bottom: 20px; border: 1px solid #333; border-radius: 4px; overflow: hidden; }
        .card-img { width: 100%; display: block; max-height: 400px; object-fit: cover; }
        .card-body { padding: 15px; }
        .card-text { font-size: 0.9rem; line-height: 1.4; color: #ddd; }
        .card-meta { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #666; border-top: 1px solid #222; padding-top: 10px; }
        
        .vote-actions { display: flex; align-items: center; }
        .vote-actions button { background: none; border: none; color: #555; cursor: pointer; font-size: 1rem; padding: 0 5px; transition: 0.2s; }
        .vote-actions button:hover { color: #fff; }
        .vote-score { font-weight: bold; color: #888; margin: 0 5px; }

        /* Floating buttons */
        .fab-add { position: absolute; bottom: 30px; right: 20px; width: 60px; height: 60px; background: #E74C3C; border-radius: 50%; border: none; color: white; font-size: 30px; z-index: 1000; cursor: pointer; box-shadow: 0 4px 10px black; }
        
        /* Add Update UI inside Feed */
        .add-update-box { padding: 15px; background: #222; border-top: 1px solid #333; }
        .add-update-box input, .add-update-box button { width: 100%; margin-bottom: 10px; padding: 10px; background: #000; border: 1px solid #444; color: white; }
        .add-update-box button { background: #E74C3C; border: none; font-weight: bold; cursor: pointer; }

        /* Modal for New Pin */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; align-items: center; justify-content: center; }
        .modal-box { background: #111; padding: 30px; border: 1px solid #E74C3C; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

    <div class="nav-header"><a href="index.html">HUB</a></div>

    <div id="map"></div>
    <button class="fab-add" onclick="startNewPin()">+</button>

    <div class="feed-panel" id="feedPanel">
        <div class="feed-header">
            <span class="feed-title">ARCHIVE RECORD</span>
            <button class="close-feed" onclick="closeFeed()">&times;</button>
        </div>
        <div class="feed-content" id="feedContent">
            </div>
        <div class="add-update-box">
            <input type="text" id="updateText" placeholder="Add comment or status update...">
            <input type="file" id="updatePhoto" style="display:none;" onchange="document.getElementById('file-label').innerText = '📸 Photo Selected'">
            <button onclick="document.getElementById('updatePhoto').click()" id="file-label" style="background:#333;">📸 Attach Photo</button>
            <button onclick="submitUpdate()">POST CONTRIBUTION</button>
        </div>
    </div>

    <div class="modal" id="newPinModal">
        <div class="modal-box">
            <h2 style="color:#E74C3C; margin-top:0;">NEW DISCOVERY</h2>
            <p id="gps-status" style="color:#666; font-size:0.8rem;">Acquiring signal...</p>
            <input type="file" id="newPhoto" accept="image/*">
            <input type="text" id="newDesc" placeholder="Description of location...">
            <br><br>
            <button onclick="submitNewPin()" style="width:100%; padding:15px; background:#E74C3C; color:white; border:none; font-weight:bold; cursor:pointer;">UPLOAD TO ARCHIVE</button>
            <button onclick="document.getElementById('newPinModal').style.display='none'" style="width:100%; padding:10px; background:none; color:#666; border:none; cursor:pointer; margin-top:10px;">CANCEL</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([51.4545, -2.5879], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);

        let activeLocationId = null;
        let newPinLat = 0, newPinLng = 0;

        // 1. Load Data
        async function loadMap() {
            try {
                const res = await fetch('/api/graffiti');
                const data = await res.json();

                // Clear map logic would go here if refreshing, for simplicity we just add
                data.forEach(loc => {
                    const icon = L.divIcon({
                        html: `<div style="background:#E74C3C; width:12px; height:12px; border-radius:50%; border:2px solid black;"></div>`,
                        className: 'custom-pin'
                    });

                    L.marker([loc.lat, loc.lng], { icon })
                     .addTo(map)
                     .on('click', () => openFeed(loc));
                });
            } catch(e) { console.error("Map load failed", e); }
        }
        loadMap();

        // 2. Feed Logic
        function openFeed(loc) {
            activeLocationId = loc.id;
            const panel = document.getElementById('feedPanel');
            const content = document.getElementById('feedContent');
            panel.classList.add('active');
            
            content.innerHTML = ''; // Clear old

            loc.contributions.forEach(c => {
                const date = new Date(c.timestamp).toLocaleDateString();
                const imageHtml = c.type === 'image' ? `<img src="${c.url}" class="card-img" loading="lazy">` : '';
                
                content.innerHTML += `
                    <div class="card">
                        ${imageHtml}
                        <div class="card-body">
                            <div class="card-text">${c.text}</div>
                            <div class="card-meta">
                                <span>${date}</span>
                                <div class="vote-actions">
                                    <button onclick="vote('${c.id}', 'up')">▲</button>
                                    <span class="vote-score" id="score-${c.id}">${c.up - c.down}</span>
                                    <button onclick="vote('${c.id}', 'down')">▼</button>
                                    <button onclick="reportContent('${c.id}')" title="Report" style="color:#e74c3c; margin-left:15px;">🚩</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function closeFeed() { document.getElementById('feedPanel').classList.remove('active'); }

        // 3. Voting
        async function vote(contribId, type) {
            await fetch(`/api/contribute/${contribId}/vote`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ type })
            });
            const scoreEl = document.getElementById(`score-${contribId}`);
            let current = parseInt(scoreEl.innerText);
            scoreEl.innerText = type === 'up' ? current + 1 : current - 1;
        }

        // 4. Reporting (New Feature)
        async function reportContent(id) {
            if(!confirm("Flag this content as inappropriate/spam? 2 reports will auto-hide it.")) return;
            try {
                const res = await fetch(`/api/report/${id}`, { method: 'POST' });
                if(res.ok) {
                    alert("Report submitted. Thank you.");
                    location.reload(); // Refresh to hide if threshold met
                } else {
                    alert("Failed to report.");
                }
            } catch(e) { alert("Server error."); }
        }

        // 5. Add Update to EXISTING Spot
        async function submitUpdate() {
            if(!activeLocationId) return;
            const text = document.getElementById('updateText').value;
            const file = document.getElementById('updatePhoto').files[0];
            
            if(!text && !file) return alert("Write something or pick a photo.");

            const formData = new FormData();
            if(file) formData.append('photo', file);
            formData.append('text', text);

            const btn = document.querySelector('.add-update-box button:last-child');
            btn.innerText = "POSTING...";
            btn.disabled = true;

            await fetch(`/api/graffiti/${activeLocationId}/contribute`, { method: 'POST', body: formData });
            location.reload();
        }

        // 6. New Pin Logic
        function startNewPin() {
            document.getElementById('newPinModal').style.display = 'flex';
            navigator.geolocation.getCurrentPosition(pos => {
                newPinLat = pos.coords.latitude;
                newPinLng = pos.coords.longitude;
                document.getElementById('gps-status').innerText = `LOCATED: ${newPinLat.toFixed(4)}, ${newPinLng.toFixed(4)}`;
                document.getElementById('gps-status').style.color = '#E74C3C';
            }, () => {
                alert("GPS failed. Ensure location services are on.");
            });
        }

        async function submitNewPin() {
            const formData = new FormData();
            formData.append('photo', document.getElementById('newPhoto').files[0]);
            formData.append('description', document.getElementById('newDesc').value);
            formData.append('lat', newPinLat);
            formData.append('lng', newPinLng);

            const btn = document.querySelector('#newPinModal button');
            btn.innerText = "UPLOADING...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/graffiti', { method: 'POST', body: formData });
                if(res.ok) location.reload();
                else {
                    const err = await res.json();
                    alert("Error: " + (err.error || "Upload failed"));
                    btn.innerText = "UPLOAD TO ARCHIVE";
                    btn.disabled = false;
                }
            } catch(e) { alert("Server error"); }
        }
    </script>
</body>
</html>
